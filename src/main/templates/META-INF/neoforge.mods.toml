modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Boss_Checklist_Additions/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/Drehverschluss/Boss_Checklist_Additions"
logoFile="boss_checklist_additions.png"
logoBlur=false
description='''${mod_description}

Unofficial addon for Boss Checklist by Yori3o.'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The mixins access private members of Boss Checklist, hence the narrow version range.
[[dependencies.${mod_id}]]
    modId="boss_checklist"
    type="required"
    versionRange="${boss_checklist_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="dynamic_difficulty"
    type="optional"
    versionRange="[1.3,)"
    ordering="AFTER"
    side="BOTH"

# Dungeon Difficulty has no API, the zone resolution uses its internal classes.
[[dependencies.${mod_id}]]
    modId="dungeon_difficulty"
    type="optional"
    versionRange="[3.9.1,4)"
    ordering="AFTER"
    side="BOTH"
